name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: budget_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Prisma schema to ephemeral database
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/budget_tracker_test?schema=public
        run: npx prisma migrate deploy

      - name: Run backend Jest tests
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/budget_tracker_test?schema=public
          JWT_ACCESS_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210
          NODE_ENV: test
        run: npm test

  flutter:
    name: Flutter Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer (error-severity only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter test suite
        run: flutter test
