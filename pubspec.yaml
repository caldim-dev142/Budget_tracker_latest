name: budget_tracker
description: A personal/family budget tracker — Flutter app with NestJS backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.2

  # Local database (offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.23
  path_provider: ^2.1.3
  path: ^1.9.0

  # Network
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Serialisation / code-gen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Auth / secure storage
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # Formatting / internationalisation
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0
  rxdart: ^0.27.7

  # Crash / observability
  # sentry_flutter: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
